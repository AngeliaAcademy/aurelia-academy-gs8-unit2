function draw(){
 if(S.i>=Q.length)return finish();
 var r=Q[S.i];S.cur=r;S.lock=0;S.fb=0;hud(r.st);
 if(r.t==='ch'){if(r.n===5&&!S.boss)mkBoss();var c=CH[r.n];app.innerHTML='<section class="chp"><div class="big">'+c.n+'</div><h2>'+c.t+'</h2><div class="en">'+c.s+'</div><p>'+c.d+'</p><div class="why"><b>Vì sao hiệu quả: </b>'+c.w+'</div><button class="btn" data-a="go" type="button">Bắt đầu chặng '+c.n+'</button></section>';window.scrollTo(0,0);return}
 app.innerHTML=R[r.t](r);window.scrollTo(0,0);
 if(r.t==='build')bd(r);if(r.t==='flash'||r.t==='bin')say(r.v?r.v[0]:r.say);var inp=$('in');if(inp)inp.focus();
}
function mkBoss(){S.boss=1;var all=[];ST.forEach(function(a){a.forEach(function(x){if(x.b)all.push(x)})});
 var miss=S.miss.map(function(m){return m.id}),w=sh(all.filter(function(x){return miss.indexOf(x.id)>-1})),o=sh(all.filter(function(x){return miss.indexOf(x.id)<0}));
 var pick=w.concat(o).slice(0,12).map(function(x){var c={};for(var k in x)c[k]=x[k];c.boss=1;c.retry=0;c.st=5;return c});
 Array.prototype.splice.apply(Q,[S.i+1,0].concat(sh(pick)))}
function grade(ok,r,ans,msg){
 S.lock=1;var k=r.k,sk=S.sk[k]||(S.sk[k]={o:0,t:0});
 if(!r.retry){S.tot++;sk.t++;if(ok){S.ok++;sk.o++}else S.miss.push(r)}
 if(ok){S.combo++;S.score+=(r.retry?50:100+Math.min(S.combo,6)*20)*(r.boss?2:1);beep(660,.12)}
 else{S.combo=0;beep(180,.25);if(!r.retry){var n=S.i+1,e=Q.length;for(var j=S.i+1;j<Q.length;j++)if(Q[j].t==='ch'){e=j;break}
  var c={};for(var q in r)c[q]=r[q];c.retry=1;c.boss=r.boss;Q.splice(Math.min(S.i+4,e),0,c)}}
 hud(r.st);S.fb=1;
 $('fb').className='fb '+(ok?'good':'bad');
 $('fb').innerHTML='<b class="h">'+(ok?'Chính xác!':'Chưa đúng')+'</b>'+(ok?'':'<p>Đáp án: <b>'+E(ans)+'</b></p>')+'<p>'+E(msg||r.e||'')+'</p>'+(ok?'':'<p class="mu">Câu này sẽ quay lại sau vài câu để não ôn lại đúng lúc.</p>')+'<button class="btn" data-a="go" type="button" id="gb">Tiếp tục</button>';
 $('gb').focus()}

};
